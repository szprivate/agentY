# agentY settings — committed DEFAULTS.
#
# Machine-specific values (absolute paths, model pins, private endpoints) belong in
# config/settings.local.json (gitignored), which is deep-merged OVER this file.
# Effective precedence for any value: environment variable > settings.local.json > here.
#
# Only override in the local file the leaves that actually differ on your machine;
# everything else is inherited from this file, so new defaults reach every install.

comfyui_url = "http://127.0.0.1:8188"
# Address the ComfyUI sidebar connects to (the agentY chat host / agent server).
#
# Two numbers because macOS does not leave 5000 free: ControlCenter's AirPlay
# Receiver listens on *:5000 there on a stock machine, and it ANSWERS (a 403 from
# AirTunes, not a refused connection), so a sidebar pointed at 5000 on a Mac
# reports the host as down while the host runs perfectly well beside it. macOS
# therefore defaults to 5001; Windows keeps 5000, where nothing claims it.
#
# Overriding `agent_server_url` in settings.local.json wins on BOTH platforms - a
# port you chose by hand or in the settings UI is never second-guessed. The
# running host also tells the sidebar which port it actually bound, so `--port`
# and AGENTY_UI_PORT are followed too, without either file being edited.
agent_server_url = "http://127.0.0.1:5000"
agent_server_url_macos = "http://127.0.0.1:5001"
# Ollama server. One address for everything that talks to Ollama — agents on a local
# model, the memory embedder, and the small llm_functions helper — so it sits here
# with the other server URLs rather than inside the Ollama tuning block. The older
# llm.ollama.host is still honoured when this is blank; OLLAMA_HOST overrides both.
ollama_server_url = "http://localhost:11434"

# ComfyUI models dir — machine-specific, set it in settings.local.json. When blank,
# agentY falls back to the directory ComfyUI reports via /system_stats.
comfyui_models_dir = ""
# Your ComfyUI install (the folder containing custom_nodes/). Only used by the
# startup update check, to find the sidebar extension it should also fast-forward.
# Blank = try the usual spots next to agentY. Env: AGENTY_COMFYUI_DIR.
comfyui_dir = ""
comfyui_custom_templates_dir = "./comfyui_workflow_templates_custom/templates/"
# Keep the official templates (in agenty_core) on the ones your ComfyUI ships. On
# start agentY asks ComfyUI for its templates version and, when that changed,
# mirrors ComfyUI's templates and rebuilds the recipe list - in the background,
# once ComfyUI answers. A custom template with the same name always wins.
sync_templates_from_comfyui = true
# Add the example workflows that came with your installed custom node packs (each
# pack's example_workflows folder) to the custom templates on start, so the agent
# can start from them. They go to templates/node_packs/ in agenty_core, which git
# ignores; a pack you remove takes its examples with it.
sync_node_pack_examples = true
# Have the utility model (llm_functions) write each of those examples a proper
# catalog description, once per example - it is what a template is found by.
# One short model call per example on the first start; later starts only do new
# or changed ones. Off = descriptions read off the graph, no model call.
describe_node_pack_examples = true
# How many conversations may run at the same time (1-20). Each running one gets an
# agent of its own, built when it is first needed (about half a second); a
# conversation started while all are busy waits for one to free up. Renders on
# your GPU still queue one after another in ComfyUI - what runs in parallel is the
# agents' thinking, building and any API-model generations. More means more LLM
# calls at once: watch your providers' rate limits. Takes effect for the next
# conversation that starts - no restart.
parallel_chats = 5
# Sequences: a lead conversation can start a conversation per shot (start_shot),
# which run in parallel within parallel_chats and report back to the lead.
# true = shots build and validate their workflows but do not render them; you
# review and queue them yourself. false = shots render like any conversation.
shots_dry_run = false
# A shot's turn that reaches this many tool calls is told to stop and report; a
# quarter more and it is stopped (the lead hears why). Research has no natural end
# and nobody may be watching a shot. 0 = no limit.
shots_max_tool_calls = 80
# MCP servers' tools (Magnific, Blender, ...) join a conversation only when it
# needs them: the agent's prompt lists each server's tool names and it loads a
# server with one call. Their full definitions are large - Magnific and Blender
# together are about 86k tokens - and would otherwise go out with every step of
# every conversation. false = every server's tools are always in the list.
# Takes effect when the agent is next built (restart).
mcp_tools_on_demand = true
# A workflow catalog read in an earlier turn (get_workflow_catalog, ~35k tokens)
# is replaced in the history by a short note at the start of the next turn; the
# turn that reads it keeps all of it, and the agent can read it again. false =
# it stays in the history for the whole window, as before.
trim_old_workflow_catalog = true
# The orchestrator's prompt no longer carries a table of every installed model
# (~10.7k tokens with ~400 models, sent with every step): it looks models up with
# find_local_models / check_model instead. true = put the table back.
# Takes effect when the agent is next built (restart).
models_table_in_prompt = false
# Tools the agent rarely calls (batch jobs, skill / custom-node authoring,
# sub-agents, annotate_image, bake_hooks_to_canvas, upload_file_to_url,
# calculator) wait in packs: the prompt lists them, and the agent loads a pack
# with one call when a request needs it. Their definitions are about a fifth of
# what every step would otherwise send. false = they are always in the list.
# Takes effect when the agent is next built (restart).
# Since 2026-10-12 also: the edit stage, model downloads, shots, unattended
# loops, taking a video apart, less common canvas work, the agent's own settings
# and the world builder - about 12k tokens of definitions per step. The edit
# pack is loaded by itself when an `agentY edit` node is on the canvas, the
# shots pack in a lead conversation.
tool_packs_on_demand = true
# A turn that ends by announcing a step - "Let me check the wiring:" - and then
# takes none is sent back to the agent (at most twice) instead of being handed
# to you as a promise. Local models do this often, hosted ones rarely. false =
# the turn ends where the agent stopped.
intent_guard = true
# In a conversation that works in the open graph, with a graph on the canvas the
# agent has not touched this turn: its first request for a NEW workflow
# (prepare_workflow) is answered once with "a graph is open - change it there, or
# ask again for a separate workflow". Local models often build anew when asked to
# change what is open; a hosted model rarely does, and pays one extra call when
# it really wants a second workflow. false = a new workflow is built at once.
edit_open_graph_first = true
# An agent that keeps making the call it has already made is stopped: the same
# tool with the same arguments, answered the same way three times, is refused the
# fourth time (polling tools - the queue, a download - get twelve); and one tool
# called 30 times in a turn gets a single notice asking the model to decide with
# what it has, then again at 60 and 120, after which the tool is closed for the
# turn. A refusal is an ordinary tool result, so the agent goes on. For every
# agent and every model.
repeat_guard = true
repeat_guard_same_call = 3
repeat_guard_per_tool = 30
# Where a result is put when it is not already in ComfyUI's output folder (a
# file fetched from ComfyUI over the network). Read against ComfyUI's
# --output-directory: blank is that folder itself, a relative path a folder
# inside it, an absolute path is used as it is. (What the agent makes itself
# goes to <ComfyUI output>/agent/images, /videos, ... whatever this says.)
output_dir = ""
# Where generated/patched workflow JSON is written. BLANK (the default) means
# "into ComfyUI": <--user-directory>/default/workflows/agentY/, which is the
# folder ComfyUI's own workflow browser lists, so agent-built graphs are one
# click away. Keeping them out of this repo also stops the startup updater from
# having to work around a permanently dirty checkout.
# Set an ABSOLUTE path to override. A relative path is used only as the fallback
# for when ComfyUI is unreachable.
output_workflows_dir = ""
# Fallback only — the live value is read from ComfyUI's --user-directory flag
# (/system_stats). Set a machine path in settings.local.json for when ComfyUI is unreachable.
comfyui_user_dir = ""
conversation_db = "./memory/conversations.sqlite"
# Auto-open every workflow the agent runs onto the ComfyUI canvas. Env: AGENTY_CANVAS_AUTOLOAD (1/0).
autoload_workflows_into_canvas = false
# Drop each finished image/video onto the canvas as a loader node pointed at it.
# On, because it is how a result becomes something you can wire into the next
# thing rather than a filename in a chat log. Turn it off when you are generating
# in bulk and would rather keep the graph clean — nothing is lost either way: the
# files are written exactly the same, and the chat names each one with its path.
# Env: AGENTY_CANVAS_DROP (1/0).
drop_outputs_into_canvas = true
# Show each finished image or video in the chat panel as well, with its number in
# the conversation printed on it. That number is how the agent knows the file, so
# "upscale 3" means the picture with a 3 on it. Off, results still land on the
# canvas and the chat names each file. Env: AGENTY_PANEL_OUTPUTS (1/0).
show_outputs_in_panel = true
# How a conversation starts. false: the agent builds each workflow separately
# (and opens it in a tab of its own when auto-graphing is on); it switches to
# working in your open graph once you ask it to put something there. true: it
# works in the graph you have open from the first message - new workflows are
# added to it and changes are made on the canvas. Either way a conversation
# keeps the mode it is in until you ask it to change.
work_in_open_graph = false
# A hook run puts every workflow it builds into the open graph, in a group of
# its own beside the hook, instead of opening a tab per workflow.
hooks_into_canvas = true
# From this many nodes on, such a workflow is folded into one subgraph node
# (0 = never fold).
hook_subgraph_min_nodes = 12

# Place the agent's written answer to a TEXT canvas hook (purpose = "text") onto
# the canvas as an "agentY text" node. The node is a readable reference only: the
# hook stays wired exactly as you drew it, and the answer is injected into the
# graph at run time whether or not this is on — so turning it off costs you the
# copy you can see and read, not the value the graph consumes. Off suits a canvas
# with many text hooks, where a node per answer buries the chain that produced
# them. The answer is in the chat either way. Env: AGENTY_CANVAS_TEXT (1/0).
place_text_nodes_on_canvas = true
# Canvas hooks: when an anchor is wired to a mid-graph node (a VAEDecode, an upscaler,
# a mask op) its value is a tensor with no file anywhere, so the agent has nothing to
# look at. With this on, that wire is rendered to a temp file before the turn starts —
# only the anchor's ancestors run, and an already-executed graph is served from
# ComfyUI's cache, but on a cold graph it does cost one upstream render.
# Env: AGENTY_HOOK_TAP (1/0). Also AGENTY_MAX_HOOK_TAPS (4), AGENTY_HOOK_TAP_FRAMES (4,
# frames taken from a batch), AGENTY_HOOK_TAP_TIMEOUT (300s).
hook_tap_tensors = true
# Canvas hooks: run only the part of the canvas the executed hooks actually reach —
# everything downstream of a hook (and of the node its anchor reads), plus whatever
# those nodes need as input. Unrelated branches on a big graph are left out instead
# of being run and written into every workflow generated for the hook. A hook that
# is bypassed/muted is not executed, so its branch drops out too. Off = run the whole
# canvas. Env: AGENTY_HOOK_SCOPE (1/0).
hook_scoped_graph = true
# Let the agent see and edit the WHOLE workflow you have open, not just the nodes
# you have selected. On, every node is listed for it each turn (id, type, your
# title, its values, shortened) and it can change any of them without you first
# clicking one — selection goes back to meaning "this one", not "you may touch
# this". Off (the default) is the older, cheaper behaviour: it sees and edits only
# what you selected.
# The reason it is off: the listing rides along on EVERY canvas turn, so you pay
# for it whether or not the turn was about the graph — roughly 250 tokens for a
# 20-node workflow, ~1.5k for 200 nodes, capped past that. Worth turning on when
# you are editing graphs conversationally; not worth it if you mostly generate.
# Env: AGENTY_CANVAS_FULL_GRAPH (1/0).
canvas_full_graph = false
# Relay ComfyUI's own terminal output — model loads, warnings, whatever a node prints —
# into the run stream while the queue is running, alongside the node-level progress.
# It is what tells you that a two-minute pause is a 25 GB checkpoint staging rather
# than a wedge. Only finished lines are relayed: tqdm's redrawing progress bar is left
# out, since the executor already draws one. Env: AGENTY_COMFY_CONSOLE (1/0).
comfyui_console_lines = true
# On start, fast-forward agentY, agenty_core and the ComfyUI sidebar extension to
# whatever their remotes have. Strictly safe: a repo with uncommitted changes or
# unpushed commits is left completely alone, it is --ff-only (never a merge, rebase
# or reset), and being offline is not an error. Set false to never check.
# Also: run_agent.ps1 -NoUpdate, or AGENTY_NO_UPDATE=1.
auto_update = true
# Which commits an update brings. "stable": each repository's `stable` branch,
# which moves only when a release is made - all four repositories together.
# "dev": each repository's `dev` branch, where new work lands first.
# AGENTY_UPDATE_CHANNEL overrides it.
update_channel = "stable"
message_history_log = "./.logs/message_history.log"
tokens_usage_log = "./.logs/tokens_usage.log"

# Which node loads and which node saves each kind of file ("" = automatic: the
# save node a workflow was built with, and the first loader this ComfyUI has).
# A node class name, e.g. image_save = "bEpicSendToViewer". Chosen in Settings.
[media_nodes]
image_load = ""
image_save = ""
video_load = ""
video_save = ""
audio_load = ""
audio_save = ""
model_load = ""
model_save = ""
# How a clip is saved when the chosen video save node can do both (bEpic's Send
# to Image Viewer): "video" = a video file (mp4), "sequence" = one image per
# frame, named prefix.1001.<ext>, in sequence_format.
video_as = "video"
sequence_format = "png"

# Who may talk to the agent host, and how long an API key may sit unrotated.
#
# The host listens on localhost, which is not the same as being private: any page
# in any browser tab can call a local server, and this one holds your .env and an
# agent that can run commands. See src/utils/api_guard.py for what each check does.
[security]
# Refuse a request whose Origin is not the page we serve. Off is for diagnosing a
# panel that will not connect, and for nothing else — with it off, any website you
# have open can drive the agent and read your keys.
check_origin = true
# Require the session token (X-AgentY-Token). The panel gets it from ComfyUI at
# page load; a script or another machine has to be given it deliberately. Turn off
# only if an old sidebar extension locks you out, and update the extension instead.
require_token = true
# Extra origins allowed to call this host, e.g. ["http://studio.local:8188"].
# Only needed when the panel is served from somewhere this cannot work out itself.
allowed_origins = []
# Extra names this host may be addressed by. Anything that is not an IP address or
# "localhost" is refused by default, because a name is what DNS rebinding needs.
allowed_hosts = []
# Warn at startup when an API key in .env has been in place this many days.
# A key never expires by itself, so the only defence that does not rely on
# noticing a breach is rotating on a clock. Pasting a new value restarts the clock
# on its own — nothing to acknowledge. 0 turns the warning off entirely.
api_key_max_age_days = 30
# Tools that stop and ask before they run. These are the ones whose effects leave
# this process: a program, evaluated Python, and code cloned from the internet.
# The prompt appears in the agentY panel with the exact command, and offers
# "allow once" or "allow for this session". Empty list = never ask.
ask_before_tools = ["run_script", "iterate", "install_custom_node"]
# How long a prompt waits for an answer before declining by itself.
tool_prompt_timeout_seconds = 120
# What to do when a tool needs approval and no panel is open to give it — a turn
# driven from Slack, or a machine left alone. "deny" refuses and tells the agent
# to ask you; "allow" runs it unreviewed, which is only sensible if you meant to
# leave this agent running unattended.
unattended_tool_policy = "deny"
# Extra programs run_script may launch, beyond python/ffmpeg/git and the usual
# listing tools. Note that a shell or a downloader here (bash, sh, curl, wget)
# makes the whole list decorative — anything can be run through it.
shell_allowed_commands = []
# Extra folders run_script may point at. ComfyUI's input/output/user directories
# are added automatically; this is for media kept somewhere else.
shell_extra_roots = []

# Image annotation — `annotate_image` circles/boxes/arrows things in a picture by
# compositing an overlay onto the untouched original (never a re-render). Finding
# WHAT to circle runs SAM 3 locally on the GPU, in this process.
#
# Nothing here needs setting on a machine where ComfyUI's SAM3 node is installed:
# the checkpoint and tokenizer are found in ComfyUI's own folders. Fill these in
# only for a non-standard layout, or when ComfyUI lives somewhere unguessable
# (also see `comfyui_dir` above).
# ── Face matching ────────────────────────────────────────────────────────────
# The model a QA check compares faces with (InsightFace, on the CPU). It is
# downloaded into models/insightface/ the first time a likeness check runs.
# "buffalo_l" is the accurate one (about 330 MB); "buffalo_s" is a tenth of that
# and noticeably less sure of itself.
[likeness]
face_model = "buffalo_l"

[annotate]
# Path to sam3.safetensors. Blank = look in <ComfyUI>/models/sam3/.
# Env: AGENTY_SAM3_CHECKPOINT.
sam3_checkpoint = ""
# Path to the CLIP BPE vocab (bpe_simple_vocab_16e6.txt.gz) SAM3 tokenises text
# with. Blank = look inside the installed sam3 package, then the ComfyUI-SAM3
# node. Env: AGENTY_SAM3_BPE.
sam3_bpe = ""
# "auto" (CUDA when available), "cuda" or "cpu". CPU works but a single lookup
# goes from ~0.2s to the order of a minute. Env: AGENTY_SAM3_DEVICE.
sam3_device = "auto"
# Drop the model and hand its ~3.5 GB of VRAM back after this many idle seconds.
# ComfyUI's model_management cannot see memory held by this process, so it cannot
# evict this to make room for a video model — hence the timer. 0 keeps it
# resident (faster repeat lookups, permanently reserved VRAM).
# Env: AGENTY_SAM3_IDLE_UNLOAD.
sam3_idle_unload_s = 180

[system_prompts]
orchestrator = "system_prompt.orchestrator.md"
query_templates = "system_prompt.query_templates.md"
# assemble_workflow: used by the spawn_subagent "assembly" preset.
assemble_workflow = "system_prompt.assemble_workflow.md"
planner = "system_prompt.planner.md"
info = "system_prompt.info.md"
learnings = "system_prompt.learnings.md"
qa_checker = "system_prompt.qaChecker.md"
refine_loop = "system_prompt.refineLoop.md"
vision_agent = "system_prompt.vision_agent.md"
search_web = "system_prompt.search_web.md"
coder = "system_prompt.coder.md"

[llm]
history_window = 12

# Which models can accept image content. agentY guesses from the model id (a "-vl"
# / "omni" / "4o" marker, or a provider that is multimodal throughout), and both
# kinds of mistake hurt: a model wrongly taken for text-only never gets shown an
# image, and one wrongly taken for multimodal makes the API reject EVERY turn of
# the conversation from then on ("Unexpected item type in content."), because the
# rejected image stays in the history. These lists override the guess — plain
# substrings matched against the model id, text_only checked first.
# e.g. vision_models = ["qwen3.7-flash"]   text_only_models = ["qwen3.7-max"]
vision_models = []
text_only_models = []

# WHICH MODEL DOES WHICH JOB.
#
# Set the six TIERS below and you are done — every role inherits from one of them.
# [llm.pipeline] underneath is per-role OVERRIDES: leave a role blank to inherit,
# fill it in only when that one job wants something different.
#
# Resolution for any role: environment variable > [llm.pipeline] > [llm.tiers] >
# a hard-coded fallback. These defaults are safe cross-provider ones (Claude Haiku
# everywhere); put your real models in settings.local.json.
[llm.tiers]
# Drives every turn: routing, tool calls, talking to you. Reasoning quality here
# is felt in everything.
orchestrator = "claude,claude-haiku-4-5"
# The orchestrator of a LEAD conversation: one that plans a sequence and starts
# a conversation per shot, then reviews what they report. Few turns, each
# deciding a lot — a stronger model pays off here. Blank = the orchestrator's.
lead = ""
# Template research, workflow assembly, repair, and building a graph from scratch.
# The heaviest reasoning in the system — a stronger model pays off most here.
research_assembly = "claude,claude-haiku-4-5"
# Short, cheap, frequent calls: info lookups, web search, planning, learnings,
# small structured-output helpers. A big model buys almost nothing.
fast_utility = "claude,claude-haiku-4-5"
# Reads the images and video YOU provide, so the agent knows what it was given.
# Must be multimodal.
vision = "claude,claude-haiku-4-5"
# Grades finished outputs against your QA briefing (see [qa]). Deliberately its
# own tier: it runs once per finished output, and a weak judge either waves bad
# work through or fails good work and triggers a pointless re-render. Multimodal.
qa_judge = "claude,claude-haiku-4-5"
# Writes Python scripts and ComfyUI custom nodes. Usually wants a code-specialist
# model rather than whatever the rest of the system uses.
coder = "claude,claude-haiku-4-5"

# PER-ROLE OVERRIDES — blank means "inherit from the tier above". Only fill one in
# when that single job needs a different model from the rest of its tier.
#   orchestrator        -> orchestrator
#   query_templates, assemble_workflow, fix_workflow_assembly,
#   generate_new_workflow                        -> research_assembly
#   info, search_web, planner, learnings,
#   llm_functions, build_skill                   -> fast_utility
#   executor_vision_model, vision_agent, video_agent  -> vision
#   qa_checker          -> qa_judge
#   coder               -> coder
[llm.pipeline]
orchestrator = ""
query_templates = ""
assemble_workflow = ""
fix_workflow_assembly = ""
generate_new_workflow = ""
info = ""
search_web = ""
planner = ""
learnings = ""
llm_functions = ""
build_skill = ""
executor_vision_model = ""
vision_agent = ""
video_agent = ""
# How many analyze_image / analyze_video calls may run at once. One agent serves
# one call at a time, so this is the size of a small pool of identical agents —
# a turn that describes a folder of references finishes in a fraction of the time.
# 0 = decide from the provider: 1 for ollama (one local GPU), else 4 (vision) /
# 2 (video, many frames per call). Env: VISION_MAX_PARALLEL / VIDEO_MAX_PARALLEL.
vision_max_parallel = 0
video_max_parallel = 0
qa_checker = ""
coder = ""

# REASONING per agent: the model thinks before it answers. Better decisions,
# slower and more tokens — worth it where few calls decide a lot (the lead),
# rarely in long tool loops. Per tier here; per role below ("" = as its tier,
# "on", "off"). The model must support it (Qwen3, DeepSeek, Claude, o-series…).
# The providers' own switches below (anthropic.think, dashscope.enable_thinking,
# ollama.think) still turn it on for EVERY agent of that provider.
[llm.thinking]
orchestrator = false
lead = true
research_assembly = false
fast_utility = false
vision = false
qa_judge = false
coder = false

[llm.thinking_roles]
query_templates = ""
assemble_workflow = ""
fix_workflow_assembly = ""
generate_new_workflow = ""
world_builder = ""
info = ""
search_web = ""
planner = ""
learnings = ""
vision_agent = ""
video_agent = ""
qa_checker = ""

[llm.ollama]
host = "http://localhost:11434"
# The model's whole window: what goes in AND what comes out ("Context Window
# Size" in Settings). 0 = worked out at startup from the graphics card's memory and
# the size of the largest local model the agents use (src/utils/ollama_window.py)
# - the largest window, up to the model's own, with which that model still fits
# the card. (Not simply the model's own: Ollama sets memory aside for the whole
# window when it loads the model, used or not - qwen3.8:27b at its own 262,144
# is about 35 GB.) Set a number to overrule it.
# What a call may SEND is this minus max_tokens: Ollama keeps the answer's
# allowance free, and a call that is longer is not refused - its start is
# dropped without a word (the request first), and what comes back is "no user
# query found in messages" or a broken tool call. The orchestrator's own prompt
# and tools are about 30,000 tokens, a first call in an open graph with project
# memory about 47,000. agentY says so in the chat when a call does not fit.
num_ctx = 0
# The most a local model may write in one answer ("Max Output Tokens").
max_tokens = 16384
repeat_penalty = 1.1
think = false
# One GPU for the agent's local model AND for ComfyUI: just before a graph is
# queued, Ollama is asked to unload its large models, so the render has the
# card. The model loads again with the agent's next call (about half a minute
# for a 20 GB model). Only acts when a role runs on Ollama. false = the model
# stays loaded for Ollama's own keep-alive - right when the agent's models are
# on another card or another machine.
unload_before_render = true

[llm.anthropic]
model = "claude-haiku-4-5"
max_tokens = 16384
# Reasoning for EVERY Claude agent. Off by default — set it per agent in
# [llm.thinking] instead. Env: ANTHROPIC_THINK (1/0).
think = false

[llm.dashscope]
# Alibaba Model Studio (DashScope) — Qwen via the OpenAI-compatible API. Put the key
# in .env (DASHSCOPE_API_KEY); set a private/regional endpoint in settings.local.json.
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen-plus"
max_tokens = 8192
# Reasoning for EVERY DashScope agent. Off by default — set it per agent in
# [llm.thinking] instead. Env: DASHSCOPE_ENABLE_THINKING (1/0).
enable_thinking = false

# Long-term agent memory (mem0). The vector store is ALWAYS local FAISS (./memory);
# nothing here changes that. Two models are involved and they are NOT interchangeable:
#
#   embedder  — turns text into VECTORS so memories can be searched by meaning.
#               An embedding model (nomic-embed-text, text-embedding-v3) does only
#               this; it cannot write text, and a chat model cannot embed. This is
#               why it is a different model from everything else in agentY.
#   llm       — writes memories in its own words ("fact extraction"). Only used for
#               `infer` writes; the normal write path never calls it. Leave it blank
#               and it follows the fast_utility tier, endpoint and key included.
#
# Changing the embedder re-embeds every stored memory with the new one (the old
# index is kept in memory/backup-embedder-<time>/); nothing is lost.
[memory]
enabled = true
store_dir = "memory"

# provider = "ollama" (local) or "openai" (ANY OpenAI-compatible endpoint, incl.
# DashScope/Qwen — set base_url to that endpoint). Blank api_key_env falls back to
# the provider's usual variable. Env: MEMORY_EMBEDDER_PROVIDER / MEMORY_EMBED_MODEL /
# MEMORY_EMBED_DIMS / MEMORY_EMBEDDER_BASE_URL.
[memory.embedder]
# The embedder, picked from the ones agentY knows: "ollama" (local
# nomic-embed-text), "dashscope" (text-embedding-v4), "gemini"
# (gemini-embedding-001) or "openai" (text-embedding-3-small) - each reached with
# that provider's key and endpoint, as the agents reach it. Blank = the fields
# below, set by hand. An embedder is not a chat model: it turns text into
# vectors, and every provider here offers one.
preset = ""
provider = "ollama"
model = "nomic-embed-text"
embedding_dims = 768
base_url = ""
api_key_env = ""

# Leave `model` BLANK to inherit the fast_utility tier — provider, endpoint and key
# come with it, so a DashScope setup does not silently end up pointed at OpenAI.
# Fill these in only to run fact extraction on something else.
[memory.llm]
provider = "ollama"
model = ""
base_url = ""
api_key_env = ""

# Output QA. When a QA BRIEFING is active, the qa_checker agent (see llm.pipeline)
# re-reads every image/video a run produced and judges it against your criteria and
# mood/reference images. A briefing comes from any of three places — an `agentY hook`
# with purpose "qa" (its directive is the checklist, its anchors are the references),
# a named file in briefing_dir, or /qa in the chat panel. No briefing, no QA: this
# section only decides HOW it runs, never whether.
[qa]
enabled = true
# Re-generate a failed output with a prompt adjusted from the failed criteria, at
# most this many times. 0 = report the verdict and stop (never re-render on its own),
# which is the setting to use if you'd rather approve each fix yourself.
max_retries = 1
# Cap how many of a run's outputs are checked. A 25-variant sweep would otherwise be
# 25 calls to a strong model; the rest are still delivered, just unchecked.
max_outputs = 6
# Cap how many reference/mood images ride along with each check.
max_references = 4
# Frames sampled from a video output. Ignored when the qa_checker can read video
# itself (it is then handed the file and judges motion/continuity, not stills).
video_frames = 3
# Named briefings: <briefing_dir>/<name>.md holds the criteria, and an optional
# sibling <name>.refs/ folder holds its mood images.
briefing_dir = "./config/qa/"

# Refine loops — `refine_canvas_until`, the agent running the graph you have open
# over and over until its output meets a condition you stated. Every iteration is
# a real generation, so this is a spend ceiling and not a suggestion: the agent
# may ask for fewer runs, never for more. Raise it if you want longer loops.
[refine]
max_runs = 4

# Slack — a SECOND line into agentY, never a replacement for the sidebar panel.
# Turns are mirrored to your Slack DM as they run, including the ones you start in
# the panel (that is the point: queue a video at the desk, watch it finish from a
# phone), and a DM back drives the same conversation the panel is in.
#
# Off unless BOTH tokens are in .env — this section only decides how it behaves:
#   SLACK_BOT_TOKEN=xoxb-…      scopes: chat:write, files:write, im:history,
#                               im:read, im:write, users:read
#   SLACK_APP_TOKEN=xapp-…      app-level token with connections:write
#   SLACK_ALLOWED_USERS=U0123…  Slack member ids allowed to drive the agent
#
# SLACK_ALLOWED_USERS has no default and is not optional: anyone able to DM the bot
# could otherwise run generations, tools and scripts on this machine. Empty means
# the bridge connects and refuses every message. See docs/slack.md.
[slack]
# OFF by default. Turning it on takes effect on the next agent start.
enabled = false
# Where the mirror posts. Blank = the DM with the first allowed user, which is
# what you want; set a channel id only if the whole team should see the pipeline.
channel = ""
# Fallback for SLACK_ALLOWED_USERS, if you would rather keep the list in settings.
allowed_users = []
# What the Slack thread under each turn carries. The answer and any generated
# media are always posted; these two are the detail the panel keeps in collapsible
# blocks — turn them off for a quieter channel.
show_tools = true
show_thinking = true
# Files above this are named rather than uploaded (Slack rejects them anyway).
max_upload_mb = 45
# Ceiling on an attachment coming the OTHER way — a video filmed on a phone and
# sent to the agent. Anything larger is refused with a note in the DM rather
# than half-downloaded.
max_download_mb = 250

# History compaction — keeps a long conversation as quick as a new one.
# Between turns (in the background, never while you wait): tool output that is no
# longer recent is cut to its start, and if the history is still over the budget,
# everything before the last `keep_turns` turns becomes one summary. Nothing is
# destroyed: what a pass changes is appended, whole, to
# memory/history_archive/<conversation>.jsonl first. The compacted history is what
# is saved, so a restart resumes from exactly the context the agent had.
# Token figures are for the HISTORY only — the system prompt and tool list
# (~60k tokens for the orchestrator) are fixed and not counted.
[compaction]
enabled = true
history_budget_tokens = 20000   # summarise older turns when history is above this
hard_budget_tokens = 60000      # mid-turn guard: age old tool output past this
# Ollama models only. A call that does not fit the model's window
# (llm.ollama.num_ctx) is not refused by Ollama: the start of it is dropped
# without a word, the user's request first. With this on, old tool output is cut
# until the call fits - one result at a time, oldest first, the newest answer of
# each tool last - and only when it really would not fit. Hosted models are
# never touched by it. The better cure is a larger window where the card has
# room: qwen3.8:27b takes 23 GB at 65536, 25 GB at 98304, 27.5 GB at 131072.
fit_local_window = true
keep_recent_messages = 8        # tool output this recent is never cut
keep_turns = 2                  # turns kept word for word when older ones are summarised
tool_result_chars = 1500        # tool output longer than this can be cut …
tool_result_head = 500          # … down to this much of its start

# Decision models - small LOCAL judges (Ollama's "decision" category). They do
# not write: given a situation and a typed question they answer with a
# probability, in a fraction of a second. Two uses, both advisory:
#
#   router        Is the request a change to the open graph, or a new workflow?
#                 Sure that it is a new workflow, agentY builds at once and skips
#                 the one-time question (edit_open_graph_first).
#                 "auto": when the ORCHESTRATOR runs on Ollama.
#   prompt_check  After a render: does each picture show what its prompt asked
#                 for? One that probably does not is named in the report.
#                 Nothing is re-rendered.
#                 "auto": whenever Ollama answers on this machine, whatever the
#                 orchestrator runs on.
#
# Never without Ollama: no Ollama, no decision model, and agentY works exactly as
# it does without one. A model name instead of "auto" uses that model; "off" =
# never.
#
# The weights are no part of the install. The first time a use is wanted its
# model is downloaded through Ollama in the background (nimble about 9.4 GB,
# clef-flash about 10 GB), with a bar in the run card; the turn does not wait,
# and the use starts once the model is there. download = false: nothing is
# fetched - pull the models yourself (`ollama pull nimble`).
#
# A probability from these models is how sure they are, not how often they are
# right - tune the thresholds on your own work.
[decision]
router = "auto"
router_model = "nimble"
router_build_below = 0.3
prompt_check = "auto"
prompt_check_model = "clef-flash"
prompt_check_below = 0.25
prompt_check_max = 8
download = true
